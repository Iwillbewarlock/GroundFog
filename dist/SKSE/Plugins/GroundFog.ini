; GroundFog: wind-driven ground fog around the player, drawn by a screen raymarch. Lengths are in game units (70 = about 1 m).

[General]
Enable = 1
; 1 = write [SELFTEST] PASS/FAIL lines to GroundFog.log after 600 drawn frames outdoors
EnableSelfTest = 0
EnableProfiler = 0
; 0 = draw just before the game's effects pass, 1 = draw just after the water effects pass
DrawStage = 0
; 0 normal, 1 plain magenta wherever the near fog is (diagnosis only),
; 2 = every pixel marches its own ray at full resolution, 64 steps (diagnosis only, heavy),
; 3 = the same at RaymarchSteps (diagnosis only, heavy): 0 against 3 shows what the half-resolution
; upsampling changes (set [Render] TemporalBlend = 0 first: 3 skips the blend with last frame), 3 against 2 what
; the step count changes, 4 = the game's sun shadow on every surface as grey (white lit, black shadowed; diagnosis only)
DebugView = 0
; language of the settings page in SKSE Menu Framework: 0 = English, 1 = Korean (needs the framework's Korean font,
; its [Fonts] EnableKorean, on by default)
MenuLanguage = 0
; diagnosis of DebugView 4: how a position is turned into the sun shadow map (0 = Community Shaders' convention, 1 - 3 others)
ShadowMatrixMode = 0
; camera matrix: 0 viewProjMat, 1 viewMat x projMat, 2 unjittered
MatrixMode = 1
; 1 = draw only with the main camera (skip menu / UI 3D cameras)
CameraFilter = 1
; 1 = every 2 s log camera rays, scene heights and fog alpha at 63 screen points ([PROBE] lines, diagnosis only)
Probe = 0

[Render]
; fog field side in units (12288 = about 176 m), round fade from 55% to 95% of the half side: full fog to about
; 48 m from you, none from 83 m. The wind and fog are simulated over this square, so its cost follows its area.
; Change it together with [Wind] Resolution and [Terrain] HeightResolution: the defaults give 32-unit wind texels
; (WorldSize / Resolution) and 64-unit height cells (WorldSize / (HeightResolution - 1)); the old 8192 field was
; Resolution 256 and HeightResolution 129. Other ratios work (the log says which sizes result) but are coarser or cost more.
WorldSize = 12288
; height of the layer's highest mounds in units (126 = 1.8 m, just below eye level); most of the layer is lower
; (0.7 m on average) and its hollows go down to 15 % of this
Thickness = 126
; extinction per metre of fog crossed
Opacity = 0.18
Brightness = 1.0
; fog has no colour of its own: it takes the colour of the sky and, where the sun reaches it, of the sunlight.
; The sun's part follows its height (none while it is behind the trees and hills at dawn, most of the light by day).
; SunMix multiplies that part: 1 = as the light is, 0 = sky colour only, up to 2
SunMix = 1
; backlit glow: fog toward a low sun shines brighter (forward scattering, Henyey-Greenstein g); daytime only, 0 = off
GlowStrength = 0.2
GlowAnisotropy = 0.6
FogPower = 1.0
FogMax = 1.0
; fog colours: -1 = auto (linear when Community Shaders Linear Lighting is on), 0 = weather colours as given, 1 = sRGB -> linear
ColorSpace = -1
; raymarch resolution relative to the screen (0.25 - 1) and steps per pixel (over the ray's stretch inside the
; fade's outer circle, where the fog is)
RaymarchScale = 0.5
RaymarchSteps = 24
; fog is densest at the ground and thins upward; higher = more of it hugs the ground; 0 = even with height (0 - 10)
ProfileSteepness = 3
; far grass: from this many units out, grass and low bushes take the fog of the ground behind them (hides their flicker)
; 0 = off (0 - 3000). Intended 600: starts at 600 units (8.6 m), whole from 1200 (17 m); 0 until it is tested in game
ThinFogStart = 0
; prototype (2026-11-15): thin low plants standing in the fog take the fog of the ground behind them along their own
; ray; big outlines keep their own fog except a 3-pixel rim. 0 = off (0 - 3000); offline tests only, not tested in game
GrassCover = 0
; with [Wind] SurfaceResponse on: fog in a dip of its surface (a runner's trail, a spell hit) looks a little darker
; and fog on the banks beside it a little brighter, so the trail reads as a groove; 0 = off (0 - 0.3).
; Intended 0.08: a runner's trail 2.5 to 4 % darker. 0 until it is tested in game
ReliefGain = 0
; blend the fog with last frame's (moved with the camera) so it does not flicker over dense bushes: the new frame's
; weight (0 = off, 0.1 = averaged over about 10 frames; lower is smoother but slower to follow changes). Tested in game
; 2026-11-16: bush flicker about 97 % less, no trails seen while turning the camera, about +0.01 to 0.1 ms
TemporalBlend = 0.1
; how the half-resolution fog is stretched to the screen: 1 = smooth weights (no 4-pixel blocks), 0 = the older window
UpsampleKernel = 1
; tests (2026-11-16, 0 = off until tested in game):
; NoisePattern 1 = shift the march's start offsets by a golden-ratio step each frame (each pixel's offsets spread evenly
; over time, which TemporalBlend then averages); 0 = as before
NoisePattern = 0
; DepthPick 1 = each half-resolution texel marches the nearest pixel of its block on every other texel and the farthest
; on the rest (checkerboard), so leaves and what is behind them both get their own fog at bush edges; 0 = the block's
; lower right pixel, as before. ThinFogStart and FogBlurRadius are not used while it is 1
DepthPick = 1
; sun shading inside the fog (on by default since 0.3.0). Above 0 the fog shades itself from the sun:
; the sunlight reaching a point is cut by the fog between it and the sun (SunShadow = how strongly; 1 = physical), so tops
; are sunlit and the depths take the sky's bluer, darker colour, most with a low sun. No effect at night.
SunShadow = 1
; brightness of fully shaded fog against sunlit fog when the sun carries its full share of the colour (0 - 1)
ShadeBrightness = 0.6
; on by default since 0.3.0: the nearest this many point lights (torches, campfires; 1 - 16) glow in the
; fog (Community Shaders' particle lights are not included); weaker by day, and only as much as there is fog where the
; light stands (a fire on the ground glows fully, a torch carried at hand height a little, a lamp above the fog not at
; all). LocalLightStrength scales the glow (a small bright core fading smoothly outward); LocalLightReach stretches how
; far it spreads (x the light's radius)
LocalLights = 16
LocalLightStrength = 0.5
LocalLightReach = 1
; test (2026-11-17): 0 = off; up to 1 = the fog lies thicker and thinner over thousands of units (0.45 to 1.3 x the
; layer), drifting slowly
BankAmount = 1


[FarFog]
; the same thin ground layer beyond the wind field, over the whole view, on the land heights around you (as far as
; the game has loaded the land), carried on past them over gentle ground, thinning out with distance
; on by default again since 0.3.0 (off in 0.2.1 because 0.2.0's far layer, estimated from the depth buffer, drew the terrain's triangles and a
; grainy pattern on far slopes). 0 also turns off the far pooled fog below (Pools). With it off the fog ends about
; 5800 units (83 m) from you (0.475 x WorldSize); use a weather or height fog mod (or [HeightFog] below) for the distance.
Enable = 1
; 0 = even layer, 1 = the same patches as the near fog
NoiseAmount = 1.0
; 1 = pooled fog in hollows and valleys beyond the near fog, within the land the game has loaded
Pools = 1

[HeightFog]
; exponential fog from the ground to the horizon (leave off when Community Shaders' height fog is on)
; known limit: its base height follows the player, so far valleys look thicker as you climb
Enable = 0
; per metre at the base height
Density = 0.002
; units for the density to fall by e
FalloffHeight = 1000
; units above the smoothed ground height under the player
BaseOffset = 0
; units; rays to the sky stop here
MaxDistance = 150000
; weather fog near/far distances x this (> 1 = game fog starts farther away; no effect when CS turns vanilla fog off)
GameFogScale = 1.0



[Conditions]
; realistic fog: radiation fog by time of day (more under clear skies), thinned by wind, by season;
; steam over water when the air is colder than the water (water lags the seasons, so mostly late autumn and winter);
; air cold from Survival Mode Improved's ambient temperature while survival mode is on, else weather, night and month
Enable = 1
; radiation fog multiplier at night, just after sunrise (~06:30) and once burnt off (11:00-16:00)
NightLevel = 1.2
MorningPeak = 1.6
AfternoonLevel = 0.35
; Sky wind speed where wind starts to clear the fog, where it clears the most, and how much it clears
WindLow = 0.3
WindHigh = 0.8
WindSuppress = 0.7
UseSurvivalTemperature = 1
; by day the weakest fog evaporates first: this x (1 - conditions multiplier) is subtracted (0 = thin evenly)
Evaporation = 0.2
; without a survival mod (or with survival mode off): how much colder the air is at night than the month's value, on
; the 0..1 cold scale; with the month it decides the steam over lakes and rivers on clear nights (0 = no night cold).
; 0.13 is one in-game reading (Survival Mode Improved, a clear summer night at Riverwood), not a researched value
NightCold = 0.13

[Placement]
; where fog collects near the player: multipliers on water, marsh, shores, valleys; steam amounts
Enable = 1
; dry ground (water, marsh and hollows gather more)
Land = 0.7
Lake = 1.8
River = 1.4
MarshWater = 2.2
MarshLand = 2.0
; steam over hot springs (any time) and over the sea / lakes and rivers when the air is cold
HotSpringSteam = 1.5
Sea = 1.2
SeaSmoke = 1.5
RiverSmoke = 1.0
; steam rises as its own column: SteamHeight units per unit of steam (0 = steam only thickens the low layer), its density
SteamHeight = 150
SteamDensity = 2.0
; pooled fog fills hollows and lake basins up to a level lid (closing of the terrain, PoolRadius units per pass,
; so hollows up to about 2x as wide), at most PoolMaxDepth above the basin floor; its density per metre (0 radius = off)
PoolRadius = 1500
PoolMaxDepth = 280
PoolDensity = 0.1
; visibility in metres inside pooled fog at its densest: fog weathers cannot make it thicker (0 = no floor)
PoolMinVisibility = 83
; wide valleys: a coarse grid (about 470 m across) fills pools up to about 175 m wide with the same rule; coarse pools fade
; where the fine ground differs from the coarse one by more than CoarseTolerance units (cliffs)
CoarsePools = 1
CoarsePoolRadius = 6144
CoarseTolerance = 250
; land at the water's edge, fading to normal over ShoreDistance units (0 = off)
ShoreFactor = 1.5
ShoreDistance = 700
; BankCap = 1: on a steep bank ShoreFactor and the valley rule stack to more than Lake or River; this holds the land at
; the water's edge to the value of the water it borders. The limit fades out across the shore band, so land further in
; can still be up to about 0.1 above the water on a steep bank. Never raises anything. Where two kinds of water meet,
; the larger value is the limit. 0 = off
BankCap = 1
; cold air pools in hollows: + ValleyStrength per ValleyScale units below the mean height within ValleyRadius units
ValleyStrength = 0.35
ValleyScale = 150
ValleyRadius = 2048

[Weather]
; fog amount follows the weather (Azurite, NAT or any weather mod) and Community Shaders' height fog density
Enable = 1
; first word found in the weather's EditorID wins (needs EditorIDs at runtime: po3 Tweaks or a similar mod)
Rules = fog:2.5, mist:2.2, haze:1.6, volcanicash:1.5, blizzard:1.4, snowstorm:1.4, storm:1.3, rain:1.2, drizzle:1.1, snow:0.9, overcast:0.9, cloud:0.8, clear:0.45, sunny:0.45
; weathers no word matched: by classification flag, times sqrt(FarReference / daytime fog distance) clamped to 0.5..2
FlagPleasant = 0.5
FlagCloudy = 0.9
FlagRainy = 1.2
FlagSnow = 1.0
FarReference = 100000
; when Community Shaders' height fog is on: x (its fogDensity / CsReferenceDensity)
FollowCommunityShaders = 1
CsReferenceDensity = 0.015

[WeatherOverrides]
; one weather per line, by EditorID or plugin|formid (hex, without the load order byte), e.g.
; SkyrimFogRE = 2.5
; NAT-ENB.esp|53B6 = 1.2

[Worldspaces]
; fog by worldspace, one per line, by EditorID or plugin|formid (hex, without the load order byte):
;   off          no fog there
;   0.5          the usual rules (weather, time of day), amount x 0.5
;   always 1.0   that amount whatever the weather and the hour (water and hollows still carry more)
;   default      the usual rules; cancels a built-in entry
; with [HeightFog] on, a number and "always <number>" both multiply its density too.
; with "always" the amount is fixed and the sun glow is off; the fog's colour still follows the sky.
; the nearest worldspace with an entry decides: the worldspace itself (a line here, then the built-in entries),
; then its parent the same way (city worldspaces follow Tamriel); with none, the usual rules.
; for a light (ESL-flagged) plugin the formid is its last 3 hex digits.
; built in, applied without any line here (write a line to change one, "default" to undo it):
; Blackreach = always 1.0
; DLC01SoulCairn = always 1.5

[Regions]
; geography: a value per weather region of the game (marsh, pine forest, coast ...), ADDED to the water-and-terrain
; multiplier of [Placement] while the player is in that region:
;   fog amount = (water and terrain + region) x weather x time of day
; it scales the low layer and the far layer; pooled fog in hollows, steam and [HeightFog] are not changed, and a
; worldspace set to "always" in [Worldspaces] takes no region value.
; one region per line, by plugin|formid (works everywhere; for a light plugin the formid is its last 3 hex digits) or
; by EditorID (only with an EditorID mod such as po3 Tweaks); values -1 .. 1, "default" = 0. One line changes one
; region only. The value settles in a few seconds when the player walks into another region, at once after a door,
; a fast travel or a load. While a weather is forced (console, quests, some mods) the game names no region: the last
; one of that worldspace is kept.
; built in, applied without any line here. Two numbers per region: near you / for the far fog. Where water and wet
; ground already raise the fog near you (marsh, the sea, hot springs, rivers) the near number is lower, so the same
; thing is not counted twice. Measured with the default [Placement] multipliers.
;   region                          near   far
;   Skyrim.esm|0C5855  WeatherTundraMarsh            0      0.5  Hjaalmarch marshes
;   Skyrim.esm|1046C8  WeatherTundraMarshNoPrecip    0      0.5
;   Skyrim.esm|0C5856  WeatherReach                  0.3    0.4
;   Skyrim.esm|07042F  WeatherMarkarth               0.3    0.4
;   Skyrim.esm|02A72D  WeatherPineForest             0.25   0.3  Falkreath Hold
;   Skyrim.esm|10474D  WeatherFalkreath              0.25   0.3
;   Skyrim.esm|0C5852  WeatherCoast                  0      0.3
;   Skyrim.esm|10FE79  WeatherCoastFog               0      0.3
;   Skyrim.esm|0C5854  WeatherVolcanicTundra         0      0.2  Eastmarch hot springs
;   Skyrim.esm|1046C7  WeatherVolcanicTundraNoPrecip 0      0.2
;   Skyrim.esm|0C5857  WeatherFallForest             0.15   0.2  The Rift
;   Skyrim.esm|1046CC  WeatherFallForestNoPrecip     0.15   0.2
;   Skyrim.esm|07042E  WeatherRiften                 0.15   0.2
;   Skyrim.esm|10FDC5  WeatherFFRiften               0.15   0.2
; to change a region, add a line "plugin|formid = number", for example:
; Skyrim.esm|0C5856 = 0.5
; one number sets BOTH near and far: "= 0" for the marsh also takes away its far fog value.
; tundra, mountains and snow regions: 0

[Wind]
; shared wind + fog field around the player (lengths in game units, 70 units is about 1 m)
Enable = 1
; cliffs and steep slopes block the air and the fog
Walls = 1
; wind texels across the field (64 - 512, a multiple of HeightResolution - 1): 384 over WorldSize 12288 = 32 units each
Resolution = 384
; fine banks and gaps inside the layer (two noise sizes, about 6 m and 2 m, drifting with the wind); 0 = smooth
WispAmount = 0.5
PressureIterations = 20
; Sky wind speed -> units/s
WindScale = 105
WindRelax = 0.5
Vorticity = 2.0
GustAmount = 0.6
GustMinimum = 40
GustWavelength = 1200
; how fast a hole or a trail in the fog closes again (1/s). 0.06: a runner's trail is back to 90 % after about
; 24 seconds, a walker's after about 8, the hole of a spell hit after about 40
FogRefill = 0.06
VelocityDissipation = 0.2
WallSlope = 1.2
; moving characters that stir the air and the fog: the nearest ones to you inside the field, at most this many (0 - 32)
MaxActors = 32
; reach of a moving character's pull on the air, and the radius of its push (70 = 1 m, a trail about 1.4 m wide).
; Anything wider than that (a mammoth, a dragon on the ground) leaves a trail as wide as its body, and a deeper one
ActorRadius = 70
; how firmly the air at a moving character is carried along with it (1/s): higher = a stronger wake behind it
ActorFollow = 6
; a running character leaves a trail in the fog: the fog on its path thins to about exp(-ActorPush) (0.35 = about
; 70 %, thinnest just behind the runner) and closes again at FogRefill; 0 = off. The running push starts at
; ActorPushMinSpeed (units/s) and is full at 1.5 x it
ActorPush = 0.35
; a walking character leaves a fainter trail: this share of ActorPush (0.3 = the path thins to about 90 %), fading
; in from 0.18 to 0.36 x ActorPushMinSpeed (about 40 to 79 units/s at 220; the game's walk is 80); 0 = walkers leave no trail
ActorPushWalk = 0.3
ActorPushMinSpeed = 220
; the wake behind a running character mixes drier air into the fog and some of it evaporates: on the path the fog
; thins by a further exp(-WakeEvaporate) (0.7 = to about half; never below 15 % of the layer), starting half a body
; width behind the character, and closes again at FogRefill; walkers get the ActorPushWalk share. 0 = off
WakeEvaporate = 0.7
; how the fog is read where a moving body drags the air along. 0 = as before. 1 = a sharper read there (16 texels
; in place of 4): a runner's trail stays almost as deep on a diagonal run as on a run along the grid's axes, which
; follow the world's east and north (with 0 it fills in on diagonal runs). Fog that only the wind moves is read as
; before. Changing it in game rebuilds the wind field (a short hitch)
FogSampling = 0
; spell hits, explosions and shouts push the fog out from the impact and let it flow back:
; BlastDepth = how empty the centre gets (the fog there thins to about exp(-BlastDepth)), BlastDuration = seconds
; the push lasts, BlastRadius = radius of the hole (105 = 1.5 m; explosions use their own size),
; BlastPush = speed (units/s) the air gains along the direction of the hit (a shout blows 1.5 x as hard)
BlastDepth = 4
BlastDuration = 0.6
BlastRadius = 105
BlastPush = 150
; size of the hole an explosion opens, as a share of the explosion's own radius (0.8: the fog is half gone out to
; about nine tenths of the explosion's radius; 0.5 = about half of it, as before)
ExplosionRadiusScale = 0.8
; fire burns the fog away instead of pushing it to the rim of the hole: this much of BlastDepth is removed for good
; (3 of 4: no bright rim round a fire hit). 0 = fire acts like any other spell
FireEvaporate = 3
; 0 = off (0.3 by default since 0.3.0); campfires, braziers and forges clear the fog round them at this rate (0.3 = within a few
; seconds; they take the impact slots spells leave free), and so does the burning ground fire spells leave (Wall of Flames)
FireClear = 0.3
; test (2026-11-17): 0 = off; a torch in the hand of the player or someone near thins the fog a little round them at
; this rate (0.01: a faint path behind someone walking, a soft dip round someone standing), out to TorchReach
; units (60 = under a metre). After Dynamic Terrain Deformation's heat sources (NearMidnightNow, used with permission)
TorchClear = 0.01
TorchReach = 60
; how a trail or a hole shows in the fog: 0 = only as thinner fog (as before); above 0 the fog's surface sinks where
; someone runs through it or a spell hits it (your legs and the grass show more, the path behind you stays as a groove)
; and rises a little on the banks beside it, with the same amount of fog (0 - 1; 1 is both the most and the intended value:
; more would make pooled fog in hollows thicker than its visibility limit allows). Wind also makes the
; surface rise and fall gently when nobody is near (more beside cliffs). 0 until it is tested in game
SurfaceResponse = 0

[Terrain]
; ground heights across the field (9 - 257): 193 over WorldSize 12288 = one every 64 units
HeightResolution = 193
RecenterDistance = 256
HeightRetriesPerFrame = 64

[Debug]
; diagnosis only, writes "grassprobe:" lines to GroundFog.log; read at game start (0 = nothing hooked, no cost) and
; needs [General] Enable = 1. 1 = every 5 s copy the scene depth right before and after the grass draws of the depth
; prepass and at the fog's draw point, and log what grass wrote and what of it is still visible, by distance, plus the
; order of the game's draw calls. 2 = the same, and every second comparison the prepass grass draw is made a little
; later in its round (after group 9) to get the depth without grass, once a normal comparison showed the same render
; state at both places. Holds 5 screen-sized staging copies of the depth, about 33 MB each at 2560x1600 (format 19,
; 8 bytes per pixel), so about 164 MB of system commit while the probe is on; set to 0 in game to release them
GrassProbe = 0
; 1 = with GrassProbe on, save a numbered pair of images (depth before grass, grass mask) as .pgm next to GroundFog.log
; on every 6th comparison in an exterior cell (in mode 2 alternating normal and deferred frames); at most 8 pairs, the
; oldest is overwritten: up to about 98 MB in the SKSE log folder at 2560x1600 (about 25 MB at a 1280x800 scene area)
GrassProbeDump = 0
